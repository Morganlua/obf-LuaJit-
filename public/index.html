<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapCut Full Bypass Suite - Morgan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-[#0B0F19] text-slate-100 min-h-screen pb-12 font-sans">

  <!-- Header -->
  <header class="max-w-2xl mx-auto px-4 pt-6 flex justify-between items-center">
    <div class="flex items-center gap-2.5">
      <div class="bg-gradient-to-tr from-cyan-600 to-indigo-600 text-white p-2.5 rounded-xl font-extrabold text-xl flex items-center justify-center w-11 h-11 shadow-md shadow-cyan-500/20">
        <i class="fa-solid fa-code"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-white tracking-tight leading-none">CapCut Full Suite</h1>
        <span class="text-[10px] text-cyan-400 font-mono font-semibold">Modular JS Bypass Engine</span>
      </div>
    </div>
    <div class="bg-slate-800/80 text-slate-300 text-xs px-3 py-1.5 rounded-xl font-bold border border-slate-700 shadow-sm">
      ✨ Morgan Dev
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 mt-6 space-y-4">
    
    <!-- Input Panel -->
    <div class="bg-slate-900/90 rounded-2xl p-5 border border-slate-800 shadow-xl space-y-4">
      <div class="space-y-1.5">
        <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-envelope text-cyan-400"></i> Target Email Akun CapCut
        </label>
        <input type="email" id="targetEmail" value="morgan.vip@capcut.mock" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-cyan-500">
      </div>

      <!-- Grid Tombol Eksekusi Modul JS -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 pt-1">
        <button onclick="runModule('subscription', '/api/subscription')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500 p-3 rounded-xl text-left transition space-y-1 group">
          <div class="text-cyan-400 font-bold text-xs flex items-center justify-between">
            <span>subscription.js</span>
            <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-0.5 transition"></i>
          </div>
          <div class="text-[10px] text-slate-400 font-medium">Inject Status Langganan</div>
        </button>

        <button onclick="runModule('rights', '/api/rights')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500 p-3 rounded-xl text-left transition space-y-1 group">
          <div class="text-indigo-400 font-bold text-xs flex items-center justify-between">
            <span>rights.js</span>
            <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-0.5 transition"></i>
          </div>
          <div class="text-[10px] text-slate-400 font-medium">Escalate VIP Privileges</div>
        </button>

        <button onclick="runModule('export', '/api/export')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500 p-3 rounded-xl text-left transition space-y-1 group">
          <div class="text-emerald-400 font-bold text-xs flex items-center justify-between">
            <span>export.js</span>
            <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-0.5 transition"></i>
          </div>
          <div class="text-[10px] text-slate-400 font-medium">Unlock 4K & Watermark</div>
        </button>

        <button onclick="runModule('user-info', '/api/user-info')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500 p-3 rounded-xl text-left transition space-y-1 group">
          <div class="text-amber-400 font-bold text-xs flex items-center justify-between">
            <span>user-info.js</span>
            <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-0.5 transition"></i>
          </div>
          <div class="text-[10px] text-slate-400 font-medium">Spoof User Profile</div>
        </button>

        <button onclick="runModule('verify', '/api/verify')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500 p-3 rounded-xl text-left transition space-y-1 group col-span-2 sm:col-span-1">
          <div class="text-rose-400 font-bold text-xs flex items-center justify-between">
            <span>verify.js</span>
            <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-0.5 transition"></i>
          </div>
          <div class="text-[10px] text-slate-400 font-medium">Bypass Token Signature</div>
        </button>
      </div>

      <!-- Tombol Eksekusi Semua Sekaligus -->
      <button onclick="runAllModules()" class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition active:scale-[0.99] shadow-lg shadow-cyan-600/20 text-xs">
        <i class="fa-solid fa-bolt"></i> Execute All Bypass Modules
      </button>

      <!-- Log Output Box -->
      <div class="space-y-2 pt-2">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400 font-bold">MODULE EXECUTION LOG:</span>
          <button onclick="clearLogs()" class="text-[10px] text-cyan-400 hover:underline">Clear Log</button>
        </div>
        <div id="logBox" class="text-[11px] font-mono text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800 h-52 overflow-y-auto space-y-2">
          <div class="text-slate-500">[System] Ready. Pilih modul di atas untuk menguji skrip JavaScript backend.</div>
        </div>
      </div>

    </div>

  </main>

  <script>
    const logBox = document.getElementById('logBox');

    function clearLogs() {
      logBox.innerHTML = '<div class="text-slate-500">[System] Log dibersihkan.</div>';
    }

    async function runModule(name, endpoint) {
      const email = document.getElementById('targetEmail').value.trim();
      logBox.innerHTML += `<div class="text-cyan-400 animate-fade">[${name}.js] Mengirim permintaan ke ${endpoint}...</div>`;
      logBox.scrollTop = logBox.scrollHeight;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const json = await res.json();

        if (json.status) {
          logBox.innerHTML += `<div class="text-emerald-400 animate-fade">[${name}.js SUCCESS] ${json.message} <br><span class="text-slate-400">Data: ${JSON.stringify(json.data)}</span></div>`;
        } else {
          logBox.innerHTML += `<div class="text-rose-400 animate-fade">[${name}.js FAILED] ${json.message}</div>`;
        }
      } catch (e) {
        logBox.innerHTML += `<div class="text-rose-400 animate-fade">[${name}.js ERROR] Gagal menghubungi endpoint server.</div>`;
      }
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function runAllModules() {
      clearLogs();
      const modules = [
        { name: 'subscription', url: '/api/subscription' },
        { name: 'rights', url: '/api/rights' },
        { name: 'export', url: '/api/export' },
        { name: 'user-info', url: '/api/user-info' },
        { name: 'verify', url: '/api/verify' }
      ];

      for (let m of modules) {
        await runModule(m.name, m.url);
        await new Promise(r => setTimeout(r, 300));
      }
    }
  </script>
</body>
</html>
