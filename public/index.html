<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noxis — Bypass Link</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c0e;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 26px 26px;
      color: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 14px 36px;
    }

    .app-shell {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: #141619;
      border: 1px solid #2b2f36;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
      padding: 18px;
    }

    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .sub-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: #9ca3af;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .main-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
    }

    .desc-text {
      margin-top: 8px;
      font-size: 13px;
      color: #b8bec7;
      line-height: 1.45;
    }

    .popup-badge {
      background: #1b1e24;
      border: 1px solid #3c424d;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .neo-field {
      width: 100%;
      background: #0d0f12;
      border: 1px solid #2e333c;
      color: #f9fafb;
      padding: 11px 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      outline: none;
    }

    .neo-field:focus {
      border-color: #6b7280;
      background: #111418;
    }

    .btn-secondary {
      background: #1c1f26;
      border: 1px solid #343944;
      color: #e5e7eb;
      padding: 0 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: #252a34;
      border-color: #525968;
    }

    .engine-bar {
      background: #0d0f12;
      border: 1px solid #2b2f36;
      padding: 10px 12px;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .engine-value {
      font-weight: 700;
      color: #ffffff;
    }

    .btn-start {
      width: 100%;
      background: #20242c;
      border: 1px solid #444b58;
      color: #ffffff;
      padding: 12px 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-start:hover:not(:disabled) {
      background: #2b303b;
      border-color: #687285;
    }

    .btn-start:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #262a32;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .logs-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .ms-badge {
      background: #0d0f12;
      border: 1px solid #2b2f36;
      color: #a3e635;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
    }

    .log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      color: #d1d5db;
    }

    .log-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .log-bullet {
      color: #9ca3af;
      font-weight: 700;
    }

    .log-done {
      color: #86efac;
      font-weight: 700;
    }

    .log-err {
      color: #fca5a5;
      font-weight: 700;
    }

    .result-box {
      background: #0d0f12;
      border: 1px solid #2e333c;
      color: #e5e7eb;
      padding: 12px;
      font-size: 12.5px;
      word-break: break-all;
      min-height: 44px;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .result-box.has-link {
      color: #ffffff;
      border-color: #4b5563;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-action {
      background: #1c1f26;
      border: 1px solid #383e4a;
      color: #f3f4f6;
      padding: 11px 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-action:hover:not(.disabled-link) {
      background: #272c37;
      border-color: #5c6578;
    }

    .disabled-link {
      opacity: 0.45;
      pointer-events: none;
    }

    .footer-credit {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="panel">
      <div class="header-box">
        <div>
          <div class="sub-kicker">Bypass Link</div>
          <h1 class="main-title">Bypass Link</h1>
          <p class="desc-text">Website Ini Membantu Kalian untuk melewati semua short link</p>
        </div>
        <div class="popup-badge">Noxis</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <span>Masukan Link</span>
      </div>
      <div class="input-row">
        <input
          type="text"
          id="linkInput"
          class="neo-field"
          placeholder="Tempel link short link di sini..."
          oninput="detectEngineLive()"
          autocomplete="off"
        />
        <button type="button" class="btn-secondary" onclick="pasteLink()">Tempel</button>
      </div>

      <div class="engine-bar">
        <span>Engine Terdeteksi:</span>
        <span class="engine-value" id="detectedEngine">-</span>
      </div>

      <button type="button" class="btn-start" id="startBtn" onclick="startBypass()">Start</button>
    </section>

    <section class="panel">
      <div class="logs-header">
        <span class="logs-title">LOGS</span>
        <span class="ms-badge" id="msBadge">0 ms</span>
      </div>
      <ul class="log-list" id="logList">
        <li><span class="log-bullet">•</span><span>Membaca Link</span></li>
        <li><span class="log-bullet">•</span><span>Proses</span></li>
        <li><span class="log-bullet">•</span><span>Menyiapkan Link</span></li>
        <li><span class="log-bullet">•</span><span>Selesai berhasil</span></li>
      </ul>
    </section>

    <section class="panel">
      <div class="section-title">
        <span>Hasil Link</span>
      </div>
      <div class="result-box" id="resultBox">Link akan muncul di sini</div>
      <div class="action-row">
        <button type="button" class="btn-action" id="copyBtn" onclick="copyResult()">Salin</button>
        <a href="#" target="_blank" rel="noopener noreferrer" class="btn-action disabled-link" id="openBtn">Buka link</a>
      </div>
    </section>

    <footer class="footer-credit">Credits Noxis Ganteng sedunia wkwk</footer>
  </div>

  <script>
    let currentResultUrl = "";

    const ENGINE_RULES = [
      { test: /(^|\.)(sfl\.gl|(khadd?avi)\.(com|net))$/i, label: "MGVT (SafelinkU)" },
      { test: /(^|\.)(bicolink\.com|bico\.link|bicosafe\.com|bicolink\.net|bclnk\.net)$/i, label: "UMPC (Bicolink)" },
      { test: /(^|\.)(linkvertise\.(com|net|download)|link-to\.net|file-link\.net|direct-link\.net)$/i, label: "LV (Linkvertise)" },
      {
        test: /(^|\.)(rekonise\.com|sub2unlock\.(com|net)|ytsubme\.com|sub4unlock\.(io|com|co|net|org|me)|unlocknow\.net|sub2get\.com|subfinal\.com|mboost\.me|social-unlock\.com|socialwolvez\.com|paster\.(so|gg)|cuty\.io|adfoc\.us|mendationforc\.info)$/i,
        label: "SOCIAL (Social Unlock)",
      },
    ];

    function detectEngineLive() {
      const raw = document.getElementById("linkInput").value.trim();
      const badge = document.getElementById("detectedEngine");
      if (!raw) {
        badge.textContent = "-";
        return;
      }
      try {
        const normalized = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
        const host = new URL(normalized).hostname.toLowerCase();
        const hit = ENGINE_RULES.find((r) => r.test.test(host));
        badge.textContent = hit ? hit.label : "Tidak dikenal";
      } catch {
        badge.textContent = "-";
      }
    }

    async function pasteLink() {
      const input = document.getElementById("linkInput");
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            input.value = text.trim();
            detectEngineLive();
            return;
          }
        }
      } catch {}
      input.focus();
    }

    function setLogs(items) {
      const list = document.getElementById("logList");
      list.innerHTML = items
        .map((item) => {
          const cls = item.type === "err" ? "log-err" : item.type === "ok" ? "log-done" : "";
          return `<li><span class="log-bullet">•</span><span class="${cls}">${item.text}</span></li>`;
        })
        .join("");
    }

    function setResultLink(url) {
      const box = document.getElementById("resultBox");
      const openBtn = document.getElementById("openBtn");
      currentResultUrl = url || "";
      if (currentResultUrl) {
        box.textContent = currentResultUrl;
        box.classList.add("has-link");
        openBtn.href = currentResultUrl;
        openBtn.classList.remove("disabled-link");
      } else {
        box.textContent = "Link akan muncul di sini";
        box.classList.remove("has-link");
        openBtn.href = "#";
        openBtn.classList.add("disabled-link");
      }
    }

    async function startBypass() {
      const rawUrl = document.getElementById("linkInput").value.trim();
      const startBtn = document.getElementById("startBtn");
      const msBadge = document.getElementById("msBadge");
      const engineBadge = document.getElementById("detectedEngine");

      setResultLink("");
      msBadge.textContent = "0 ms";

      if (!rawUrl) {
        setLogs([
          { text: "Membaca Link", type: "err" },
          { text: "Proses", type: "" },
          { text: "Menyiapkan Link", type: "" },
          { text: "Gagal: Link belum diisi", type: "err" },
        ]);
        return;
      }

      detectEngineLive();
      startBtn.disabled = true;
      startBtn.textContent = "Memproses...";

      setLogs([
        { text: "Membaca Link", type: "ok" },
        { text: "Proses", type: "" },
        { text: "Menyiapkan Link", type: "" },
        { text: "Selesai berhasil", type: "" },
      ]);

      const tStart = performance.now();

      try {
        const res = await fetch(`/api/bypass?url=${encodeURIComponent(rawUrl)}`);
        const data = await res.json();
        const elapsed = Math.round(data.execution_time_ms || performance.now() - tStart);
        msBadge.textContent = `${elapsed} ms`;

        if (data.engine_label) {
          engineBadge.textContent = data.engine_label;
        }

        if (res.ok && data.status && data.data && data.data.bypassed_url) {
          setLogs([
            { text: "Membaca Link", type: "ok" },
            { text: "Proses", type: "ok" },
            { text: "Menyiapkan Link", type: "ok" },
            { text: "Selesai berhasil", type: "ok" },
          ]);
          setResultLink(data.data.bypassed_url);
        } else {
          setLogs([
            { text: "Membaca Link", type: "ok" },
            { text: "Proses", type: "err" },
            { text: "Menyiapkan Link", type: "" },
            { text: `Gagal: ${data.error || "Tidak dapat memproses link"}`, type: "err" },
          ]);
        }
      } catch (err) {
        const elapsed = Math.round(performance.now() - tStart);
        msBadge.textContent = `${elapsed} ms`;
        setLogs([
          { text: "Membaca Link", type: "ok" },
          { text: "Proses", type: "err" },
          { text: "Menyiapkan Link", type: "" },
          { text: `Error: ${(err && err.message) || "Koneksi gagal"}`, type: "err" },
        ]);
      } finally {
        startBtn.disabled = false;
        startBtn.textContent = "Start";
      }
    }

    async function copyResult() {
      const copyBtn = document.getElementById("copyBtn");
      if (!currentResultUrl) return;
      try {
        await navigator.clipboard.writeText(currentResultUrl);
        const old = copyBtn.textContent;
        copyBtn.textContent = "Tersalin";
        setTimeout(() => {
          copyBtn.textContent = old;
        }, 1400);
      } catch {}
    }
  </script>
</body>
</html>
