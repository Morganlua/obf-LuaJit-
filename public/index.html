<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noxis React Ch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdfbf7;
      --surface: #ffffff;
      --orange: #ff4500;
      --orange-hover: #e03d00;
      --yellow: #ffcc00;
      --green: #00e676;
      --blue: #00b0ff;
      --red: #ff3d00;
      --ink: #111111;
      --border: 4px solid #111111;
      --shadow: 6px 6px 0px #111111;
      --shadow-sm: 3px 3px 0px #111111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(#111111 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-container {
      width: 320px;
      background: var(--surface);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .loading-title {
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .loading-bar-wrapper {
      width: 100%;
      height: 16px;
      background: #eee;
      border: 3px solid #111;
      overflow: hidden;
      position: relative;
    }

    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--orange);
      transition: width 0.1s linear;
    }

    .loading-percentage {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.95rem;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#111111 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.4s ease-in;
    }

    body.loaded {
      opacity: 1;
    }

    header {
      background: var(--orange);
      border-bottom: var(--border);
      padding: 24px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 0px #111111;
      animation: fadeInUp 0.5s ease-out;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-badge {
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 8px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1rem;
      animation: pulseBadge 2.5s infinite ease-in-out;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 3px 3px 0px #111111;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .channel-btn {
      background: var(--yellow);
      color: var(--ink);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 10px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .channel-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #111111;
    }

    main {
      width: 100%;
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 32px;
      animation: fadeInUp 0.6s ease-out;
    }

    .card {
      background: var(--surface);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 34px;
      border-radius: 6px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #111111;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 3px solid #111111;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.3px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-label {
      font-weight: 800;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .neo-input {
      width: 100%;
      height: 60px;
      padding: 0 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      background: var(--bg);
      border: var(--border);
      color: var(--ink);
      outline: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .neo-input:focus {
      background: #ffffff;
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0px #111111;
    }

    .emoji-picker-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .emoji-pill {
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 8px 14px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .emoji-pill:hover {
      background: #ffd500;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #111111;
    }

    .btn-action {
      margin-top: 10px;
      width: 100%;
      height: 62px;
      background: var(--orange);
      color: #ffffff;
      border: var(--border);
      box-shadow: var(--shadow);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .btn-action:hover:not(:disabled) {
      background: var(--orange-hover);
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0px #111111;
    }

    .btn-action:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #111111;
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #888888;
    }

    .logs-box {
      background: #141414;
      color: #f8f8f2;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 22px;
      font-family: 'JetBrains Mono', monospace;
      border-radius: 4px;
      max-height: 320px;
      overflow-y: auto;
    }

    .logs-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333333;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .logs-heading {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--yellow);
      text-transform: uppercase;
    }

    .log-content {
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-alert {
      background: var(--red);
      color: #ffffff;
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      display: none;
      margin-top: 16px;
    }

    .success-alert {
      background: var(--green);
      color: #111111;
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      display: none;
      margin-top: 16px;
    }

    footer {
      background: var(--surface);
      border-top: var(--border);
      padding: 26px;
      text-align: center;
      box-shadow: 0 -4px 0px #111111;
    }

    .footer-main {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink);
    }

    .footer-sub {
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--orange);
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loading-container">
      <div class="loading-title">Noxis React Ch</div>
      <div class="loading-bar-wrapper">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
      <div class="loading-percentage" id="loadingPercentage">0%</div>
    </div>
  </div>

  <header>
    <div class="brand">
      <div class="brand-badge">NOXIS</div>
      <div class="brand-title">Noxis React Ch</div>
    </div>
    <a href="https://whatsapp.com/channel/0029Vb82nkLEwEjtLSQ49I44" target="_blank" rel="noopener noreferrer" class="channel-btn">Saluran WA</a>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <span class="card-title">Kirim Auto Reaction</span>
        <span style="font-family:'JetBrains Mono'; font-weight:800; font-size:0.85rem; background:#ffcc00; border:2px solid #111; padding:4px 10px; box-shadow:2px 2px 0px #111;">VIP MULTI-KEY</span>
      </div>

      <div class="input-group">
        <label class="input-label" for="channelUrl">URL Post WhatsApp Channel</label>
        <input
          type="url"
          id="channelUrl"
          class="neo-input"
          placeholder="https://whatsapp.com/channel/0029VbDyL6d9RZAh3JjEM325/158"
          autocomplete="off"
        />
      </div>

      <div class="input-group">
        <label class="input-label" for="emojiInput">Pilih atau Ketik Emoji (Maks 5, pisah koma)</label>
        <div class="emoji-picker-row">
          <button type="button" class="emoji-pill" onclick="addEmoji('👍')">👍</button>
          <button type="button" class="emoji-pill" onclick="addEmoji('❤️')">❤️</button>
          <button type="button" class="emoji-pill" onclick="addEmoji('🔥')">🔥</button>
          <button type="button" class="emoji-pill" onclick="addEmoji('😂')">😂</button>
          <button type="button" class="emoji-pill" onclick="addEmoji('💦')">💦</button>
          <button type="button" class="emoji-pill" onclick="addEmoji('🚀')">🚀</button>
          <button type="button" class="emoji-pill" onclick="addEmoji('🎉')">🎉</button>
          <button type="button" class="emoji-pill" onclick="addEmoji('👏')">👏</button>
        </div>
        <input
          type="text"
          id="emojiInput"
          class="neo-input"
          placeholder="👍 atau 💦,👍"
          autocomplete="off"
        />
      </div>

      <button type="button" class="btn-action" id="btnSend" onclick="sendReaction()">Kirim Reaction Sekarang</button>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-title">Console & Status Eksekusi</span>
      </div>

      <div class="logs-box">
        <div class="logs-top">
          <span class="logs-heading">System Output</span>
          <span style="font-family:'JetBrains Mono'; font-size:0.85rem; color:#00e676;" id="statusBadge">IDLE</span>
        </div>
        <div class="log-content" id="logContent">Sistem siap menerima perintah. Masukkan URL dan emoji di atas...</div>
      </div>

      <div class="error-alert" id="errorBox"></div>
      <div class="success-alert" id="successBox"></div>
    </section>
  </main>

  <footer>
    <div class="footer-main">Website ini dibuat oleh King Noxis Lua yang ganteng</div>
    <div class="footer-sub">Noxis React Ch Engine v2.0</div>
  </footer>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      let progress = 0;
      const fill = document.getElementById("loadingBarFill");
      const text = document.getElementById("loadingPercentage");
      const screen = document.getElementById("loading-screen");

      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 18) + 8;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          fill.style.width = "100%";
          text.textContent = "100%";
          setTimeout(() => {
            screen.style.opacity = "0";
            screen.style.visibility = "hidden";
            document.body.classList.add("loaded");
          }, 300);
        } else {
          fill.style.width = progress + "%";
          text.textContent = progress + "%";
        }
      }, 50);
    });

    function addEmoji(emoji) {
      const input = document.getElementById("emojiInput");
      const current = input.value.trim();
      if (!current) {
        input.value = emoji;
      } else {
        input.value = current + ", " + emoji;
      }
    }

    async function sendReaction() {
      const url = document.getElementById("channelUrl").value.trim();
      const reaction = document.getElementById("emojiInput").value.trim();
      const btn = document.getElementById("btnSend");
      const log = document.getElementById("logContent");
      const statusBadge = document.getElementById("statusBadge");
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");

      errorBox.style.display = "none";
      successBox.style.display = "none";

      if (!url || !reaction) {
        errorBox.textContent = "URL Channel WhatsApp dan Emoji wajib diisi!";
        errorBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Mengirim...";
      statusBadge.textContent = "PROCESSING";
      statusBadge.style.color = "#ffcc00";
      log.textContent = `[${new Date().toLocaleTimeString()}] Mengirim request reaction ke server...\nTarget: ${url}\nEmoji: ${reaction}`;

      try {
        const res = await fetch("/api/react", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, reaction })
        });

        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch {
          throw new Error(`Respons server bukan JSON valid (HTTP ${res.status}): ${rawText.slice(0, 160)}`);
        }

        if (res.ok && data.status) {
          statusBadge.textContent = "SUCCESS";
          statusBadge.style.color = "#00e676";
          successBox.textContent = `Berhasil! ${data.message || "Reaction terkirim."} (Waktu: ${data.time || "-"})`;
          successBox.style.display = "block";
          log.textContent += `\n\n[SUCCESS] Response:\n${JSON.stringify(data, null, 2)}`;
        } else {
          statusBadge.textContent = "FAILED";
          statusBadge.style.color = "#ff3d00";
          errorBox.textContent = `Gagal: ${data.error || `HTTP ${res.status}`}`;
          errorBox.style.display = "block";
          log.textContent += `\n\n[ERROR] Response:\n${JSON.stringify(data, null, 2)}`;
        }
      } catch (err) {
        statusBadge.textContent = "ERROR";
        statusBadge.style.color = "#ff3d00";
        const msg = err && err.message ? err.message : String(err);
        errorBox.textContent = `Network Error: ${msg}`;
        errorBox.style.display = "block";
        log.textContent += `\n\n[EXCEPTION] ${msg}`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Kirim Reaction Sekarang";
      }
    }
  </script>
</body>
</html>
